name: Post-deploy smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed ITIL-EvalApp base URL (https://...)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run non-destructive deployment smoke
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_ACCESS_CODE: ${{ secrets.POST_DEPLOY_SMOKE_ACCESS_CODE }}
        run: npm run test:postdeploy
