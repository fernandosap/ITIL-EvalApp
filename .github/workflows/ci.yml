name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Unit and regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log

      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check playwright.config.js
          node --check scripts/migrate-runtime.mjs
          node --check scripts/check-env.mjs
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find lib client shared tests/e2e -type f \( -name '*.js' -o -name '*.cjs' \) -print0)

      - name: Repository secret scan
        shell: bash
        run: |
          set -euo pipefail
          PATTERNS_FILE=.githooks/secret-patterns.txt
          COMBINED=$(grep -v -E '^\s*(#|$)' "$PATTERNS_FILE" | paste -sd '|' -)
          [ -n "$COMBINED" ] || exit 0
          HITS=$(git grep -n -E "$COMBINED" -- . ':!.githooks/*' ':!package-lock.json' || true)
          HITS=$(printf '%s\n' "$HITS" | grep -v 'secretscan: ok' || true)
          if [ -n "$HITS" ]; then
            echo "Possible secret pattern(s) detected:"
            printf '%s\n' "$HITS" | head -20
            exit 1
          fi

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright test runner without changing lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser integration smoke
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --config=playwright.config.js 2>&1 | tee playwright-test.log

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-log
          path: |
            playwright-test.log
            test-results
          if-no-files-found: ignore
          retention-days: 2
