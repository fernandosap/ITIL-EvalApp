name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Unit and regression tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit-test.log

      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check playwright.config.js
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find lib client shared scripts tests/e2e -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0)

      - name: Repository secret scan
        run: npm run scan:secrets

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install pinned Playwright runner without changing lockfile
        run: |
          npm run test:e2e:setup
          git diff --exit-code -- package.json package-lock.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser integration smoke
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright-test.log

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-log
          path: |
            playwright-test.log
            test-results
          if-no-files-found: ignore
          retention-days: 2
